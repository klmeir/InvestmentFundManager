AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CloudFormation template to create DynamoDB tables for InvestmentFundManager:
  - Funds (base funds catalog)
  - FundsTransactions (user transactions: subscriptions and cancellations)

Resources:
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Users
      AttributeDefinitions:
        - AttributeName: Id
          AttributeType: S
      KeySchema:
        - AttributeName: Id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
  FundsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Funds
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: Id
          AttributeType: S
      KeySchema:
        - AttributeName: Id
          KeyType: HASH

  FundsTransactionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: FundsTransactions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: Id
          AttributeType: S
        - AttributeName: User
          AttributeType: S
      KeySchema:
        - AttributeName: Id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIndex
          KeySchema:
            - AttributeName: User
              KeyType: HASH
          Projection:
            ProjectionType: ALL
  EmailTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: EmailTopic

  SmsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: SmsTopic

Outputs:
  EmailTopicArn:
    Value: !Ref EmailTopic
    Export:
      Name: EmailTopicArn

  SmsTopicArn:
    Value: !Ref SmsTopic
    Export:
      Name: SmsTopicArn
